name: data-refresh
# Rebuild the open data the app ships with and open a pull request when it changes (issue #14).
# Weekly: bus, tram and Metro timetables (BODS GTFS), pavement works (Street Manager), the
# search index (OSM, plus the pinned Overture release), the street graphs (fresh OSM, the same
# LiDAR; DATA-11) and the layers keyed to them, park gates, OSM notes and the Toilet Map.
# Base maps stay manual: they need a reviewed Protomaps build, and they change slowly.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install osmium duckdb pyshp
      - run: pnpm install --frozen-lockfile

      # Everything is downloaded fresh each run (about 2 GB, mostly GTFS and the Street Manager archive).
      - name: Fresh sources
        run: |
          mkdir -p .data-cache
          rm -f .data-cache/gtfs-*.zip .data-cache/*.overture-*.json .data-cache/*-[0-9].osm .data-cache/*.bus-stop-facts.json
          curl -sSfL -o .data-cache/Edinburgh.osm.pbf https://download.bbbike.org/osm/bbbike/Edinburgh/Edinburgh.osm.pbf

      # Each step fails softly: one source being down shouldn't block the others.
      # Places first: it downloads the OSM tiles that the bus stop facts also read.
      - name: Search index
        run: |
          for a in edinburgh-central newcastle-gateshead london-jubilee; do pnpm build:places "$a" || echo "::warning::places failed for $a"; done
        continue-on-error: true
      - name: Buses, trams and Metro
        run: pnpm build:bus
        continue-on-error: true
      - name: Pavement works
        run: |
          rm -f .data-cache/sm-permit-*.json .data-cache/sm-activity-*.json
          pnpm build:works
        continue-on-error: true

      # Street graphs (DATA-11): about a minute each. They reuse the OSM the search index fetched.
      - name: Street graphs
        run: |
          python3 scripts/osm-extract.py .data-cache/Edinburgh.osm.pbf .data-cache/edinburgh-central.osm -3.25 55.92 -3.15 55.975
          for a in edinburgh-central newcastle-gateshead london-jubilee; do pnpm build:area "$a" || echo "::warning::graph failed for $a"; done
        continue-on-error: true
      # Keyed to the graphs' OSM ways and nodes, so they follow a rebuild.
      - name: Council footways and flood areas
        run: |
          pnpm build:footways || echo "::warning::council footways failed"
          pnpm build:floods || echo "::warning::flood areas failed"
        continue-on-error: true
      - name: Park gates, OSM notes and the Toilet Map
        run: |
          pnpm build:greenspace || echo "::warning::park gates failed"
          pnpm build:osm-notes || echo "::warning::OSM notes failed"
          pnpm build:toilets || echo "::warning::Toilet Map failed"
        continue-on-error: true

      - name: Check the app still works with the new data
        run: |
          pnpm typecheck
          pnpm test

      - name: Summary
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo 'Weekly data refresh. Counts now, with the change since `main`:'
            echo
            pnpm -s tsx scripts/data-summary.ts --compare origin/main
            echo
            echo 'Built by the data-refresh workflow. Check the bus and works counts for sudden drops (a feed outage) before merging.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: data-refresh
          base: main
          title: "Data refresh: graphs, timetables, works, places and layers"
          commit-message: "Refresh street graphs, timetables, pavement works, the search index and the layers on them"
          body: ${{ steps.summary.outputs.body }}
          add-paths: |
            data/places/*.json.gz
            data/places/*.greenspace.json
            data/places/*.osm-notes.json
            data/places/*.toiletmap.json
            data/transit/*/bus.json
            data/live/*.works.json
            data/live/*.flood-areas.json
            data/snapshots/edinburgh-central.graph.json.gz
            data/snapshots/newcastle-gateshead.graph.json.gz
            data/snapshots/london-jubilee.graph.json.gz
            data/council/*.json
          delete-branch: true
