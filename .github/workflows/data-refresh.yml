name: data-refresh
# Rebuild the open data the app ships with and open a pull request when it changes (issue #14).
# Weekly: bus, tram and Metro timetables (BODS GTFS), pavement works (Street Manager in England,
# the Scottish Road Works Register in Edinburgh), the
# search index (OSM, plus the pinned Overture release), the street graphs (fresh OSM, the same
# LiDAR; DATA-11) and the layers keyed to them, park gates, OSM notes and the Toilet Map.
# Base maps stay manual: they need a reviewed Protomaps build, and they change slowly.
on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # No write token left in .git/config while third-party packages and scripts run (SEC-19).
          # create-pull-request below is given the token itself.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Exact versions with hashes (SEC-19). To update, see the top of scripts/requirements.txt.
      - run: pip install --require-hashes -r scripts/requirements.txt
      - run: pnpm install --frozen-lockfile

      # Everything is downloaded fresh each run (about 2 GB, mostly GTFS and the Street Manager archive).
      - name: Fresh sources
        run: |
          mkdir -p .data-cache
          rm -f .data-cache/gtfs-*.zip .data-cache/*.overture-*.json .data-cache/*-[0-9].osm .data-cache/*.bus-stop-facts.json
          curl -sSfL -o .data-cache/Edinburgh.osm.pbf https://download.bbbike.org/osm/bbbike/Edinburgh/Edinburgh.osm.pbf

      # Each step fails softly: one source being down shouldn't block the others.
      # Places first: it downloads the OSM tiles that the bus stop facts also read.
      - name: Search index
        run: |
          for a in edinburgh-central newcastle-gateshead london-jubilee; do pnpm build:places "$a" || echo "::warning::places failed for $a"; done
        continue-on-error: true
      - name: Buses, trams and Metro
        run: pnpm build:bus
        continue-on-error: true
      - name: Pavement works
        run: |
          rm -f .data-cache/sm-permit-*.json .data-cache/sm-activity-*.json
          pnpm build:works
        continue-on-error: true
      # Edinburgh: the register's daily disruptions export (OGL v3, no key). One request; the script waits and retries if rate-limited.
      - name: Pavement works, Scotland
        run: pnpm build:srwr
        continue-on-error: true

      # Street graphs (DATA-11): about a minute each. They reuse the OSM the search index fetched.
      - name: Street graphs
        run: |
          python3 scripts/osm-extract.py .data-cache/Edinburgh.osm.pbf .data-cache/edinburgh-central.osm -3.25 55.92 -3.15 55.975
          for a in edinburgh-central newcastle-gateshead london-jubilee; do pnpm build:area "$a" || echo "::warning::graph failed for $a"; done
        continue-on-error: true
      # Keyed to the graphs' OSM ways and nodes, so they follow a rebuild.
      - name: Council footways and flood areas
        run: |
          pnpm build:footways || echo "::warning::council footways failed"
          pnpm build:floods || echo "::warning::flood areas failed"
        continue-on-error: true
      - name: Park gates, OSM notes, the Toilet Map and bank holidays
        run: |
          pnpm build:greenspace || echo "::warning::park gates failed"
          pnpm build:osm-notes || echo "::warning::OSM notes failed"
          pnpm build:toilets || echo "::warning::Toilet Map failed"
          pnpm build:holidays || echo "::warning::bank holidays failed"
        continue-on-error: true

      - name: Check the app still works with the new data
        run: |
          pnpm typecheck
          pnpm test

      # Counts that fell further than their limit (STAB-06): the PR still opens, as a draft that says why, and the run fails.
      - name: Guard against sudden drops
        id: guard
        run: |
          set +e
          drops=$(pnpm -s tsx scripts/data-summary.ts --compare origin/main --guard)
          code=$?
          { echo 'drops<<EOF'; echo "$drops"; echo 'EOF'; } >> "$GITHUB_OUTPUT"
          echo "failed=$([ $code -ne 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Summary
        id: summary
        # Through the environment, not pasted into the script.
        env:
          GUARD_FAILED: ${{ steps.guard.outputs.failed }}
          GUARD_DROPS: ${{ steps.guard.outputs.drops }}
        run: |
          {
            echo 'body<<EOF'
            if [ "$GUARD_FAILED" = "true" ]; then
              echo '**Do not merge yet.** These counts fell further than their limit in `scripts/data-summary.ts`. A feed was probably down or a build failed:'
              echo
              echo "$GUARD_DROPS"
              echo
            fi
            echo 'Weekly data refresh. Counts now, with the change since `main`:'
            echo
            pnpm -s tsx scripts/data-summary.ts --compare origin/main
            echo
            echo 'Built by the data-refresh workflow. Check the bus and works counts for sudden drops (a feed outage) before merging.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # Passed here, not left behind by the checkout. This is also the action's default.
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: data-refresh
          base: main
          draft: ${{ steps.guard.outputs.failed == 'true' }}
          title: "Data refresh: graphs, timetables, works, places and layers"
          commit-message: "Refresh street graphs, timetables, pavement works, the search index and the layers on them"
          body: ${{ steps.summary.outputs.body }}
          add-paths: |
            data/places/*.json.gz
            data/places/*.greenspace.json
            data/places/*.osm-notes.json
            data/places/*.toiletmap.json
            data/transit/*/bus.json
            data/live/*.works.json
            data/live/*.flood-areas.json
            data/snapshots/edinburgh-central.graph.json.gz
            data/snapshots/newcastle-gateshead.graph.json.gz
            data/snapshots/london-jubilee.graph.json.gz
            data/council/*.json
            apps/web/src/lib/bank-holidays.json
          delete-branch: true

      - name: Fail on sudden drops
        if: steps.guard.outputs.failed == 'true'
        run: |
          echo "::error::Counts fell further than their limit. See the data-refresh pull request."
          exit 1
