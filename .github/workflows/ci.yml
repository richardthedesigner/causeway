name: ci
on:
  push:
    # Both: work lands on either, and the mirror's own push (GITHUB_TOKEN) doesn't trigger workflows.
    branches: [main, claude/sleepy-johnson-mavbrs]
  pull_request:

# Read the code, nothing more (SEC-03).
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known high or critical holes in any dependency fail the build (SEC-04).
      - run: pnpm audit --audit-level high
      - run: pnpm typecheck
      # Unused files, exports and dependencies (BLOAT-02). knip.json says what the entry points are.
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm --filter @causeway/web typecheck
      - run: pnpm web:build
      # Accessibility: axe-core WCAG 2.2 AA on the built app, light and dark, under the real security headers (scripts/a11y-check.mjs).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm a11y
      # End to end: search, route, start, arrive and end in each city, under the real security headers (scripts/e2e.mjs).
      - run: pnpm e2e
      # Screenshots of the main screens, at phone size, 320 px and 200% text, against tests/screenshots/ (scripts/screenshots.mjs).
      # Run `pnpm screenshots --update` and commit the pictures when a screen is meant to change.
      - name: Screenshots
        run: pnpm screenshots
      - name: Screenshot differences
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshot-diffs
          path: tests/screenshots/diff/
          if-no-files-found: ignore

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          for f in db/migrations/*.sql; do
            PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Sharing rules (row-level security)
        run: scripts/test-db.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
