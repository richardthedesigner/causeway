name: mirror-production
# main is the working branch, but the repo's default branch (and so Vercel's
# production branch) is still claude/sleepy-johnson-mavbrs, and new work still
# lands there. Keep the two equal in both directions so either can be pushed
# to. Fast-forward only: if they ever diverge, this fails instead of
# overwriting anything, and the branches need merging by hand.
# Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.
on:
  push:
    branches: [main, claude/sleepy-johnson-mavbrs]

permissions:
  contents: write

concurrency:
  group: mirror-production

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fast-forward the other branch
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then target=claude/sleepy-johnson-mavbrs; else target=main; fi
          git push origin "HEAD:refs/heads/$target"
