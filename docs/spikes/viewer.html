<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 0 spike routes</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg: #f7f5f0; --fg: #1d1d1b; --muted: #5b5b57; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #f2f0ea; --muted: #a8a69f; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel { position: absolute; left: 16px; right: 16px; bottom: 16px; max-width: 480px; background: var(--bg); border-radius: 16px; padding: 16px; box-shadow: 0 4px 24px rgb(0 0 0 / .2); }
  select { font: inherit; min-height: 48px; width: 100%; margin-bottom: 8px; }
  label { display: flex; align-items: center; gap: 8px; min-height: 48px; }
  .meta { color: var(--muted); }
</style>
</head>
<body>
<div id="map" role="img" aria-label="Map of the selected journey. The same routes are listed in the panel."></div>
<div id="panel">
  <select id="journey" aria-label="Journey"></select>
  <div id="routes"></div>
</div>
<script>
// Serve the repo root (e.g. `npx serve .`) and open /docs/spikes/viewer.html.
const COLOURS = { walking: "#5b5b57", "manual-wheelchair": "#0b6e4f", "manual-wheelchair-companion": "#2a9d8f", powerchair: "#7a3e9d" };
const DASH = { walking: [2, 2], "manual-wheelchair": [1, 0], "manual-wheelchair-companion": [4, 1], powerchair: [1, 1] };
const map = new maplibregl.Map({ container: "map", style: "https://tiles.openfreemap.org/styles/positron", center: [-3.194, 55.9495], zoom: 15 });
map.on("load", async () => {
  const fc = await (await fetch("phase0-edinburgh.geojson")).json();
  const journeys = [...new Set(fc.features.map(f => f.properties.journey))];
  const sel = document.getElementById("journey");
  for (const j of journeys) sel.add(new Option(j.replaceAll("-", " "), j));
  for (const f of fc.features) {
    const id = `${f.properties.journey}:${f.properties.profile}`;
    map.addSource(id, { type: "geojson", data: f });
    map.addLayer({ id, type: "line", source: id, paint: { "line-color": COLOURS[f.properties.profile], "line-width": 5, "line-dasharray": DASH[f.properties.profile] }, layout: { visibility: "none", "line-cap": "round" } });
  }
  const show = () => {
    const out = document.getElementById("routes"); out.innerHTML = "";
    for (const f of fc.features) {
      const id = `${f.properties.journey}:${f.properties.profile}`;
      const on = f.properties.journey === sel.value;
      map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
      if (!on) continue;
      const p = f.properties, w = p.worstInclinePct;
      const row = document.createElement("label");
      row.innerHTML = `<input type="checkbox" checked> <span><strong>${p.label}</strong><br><span class="meta">${Math.round(p.minutes)} min / ${(p.distanceM / 1000).toFixed(1)} km / max ${w === null ? "unknown" : Math.abs(w) + "%"} / ${p.unknownM} m unknown</span><br>${p.headline}</span>`;
      row.querySelector("input").onchange = e => map.setLayoutProperty(id, "visibility", e.target.checked ? "visible" : "none");
      out.append(row);
    }
  };
  sel.onchange = show; show();
});
</script>
</body>
</html>
